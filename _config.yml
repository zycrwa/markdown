# Site
title: ZY 的技术笔记
subtitle: 编程、工具与 AI 学习记录
description: ZY 的个人技术学习博客
keywords: C语言, Git, AI, 学习笔记
author: ZY
language: zh-CN
timezone: Asia/Shanghai

# URL
url: https://zycrwa.github.io/markdown
root: /markdown/
permalink: :year/:month/:day/:title/
permalink_defaults: {}
pretty_urls:
  trailing_index: true
  trailing_html: true

# Directory
source_dir: source
public_dir: public
tag_dir: tags
archive_dir: archives
category_dir: categories
code_dir: downloads/code
i18n_dir: :lang
skip_render:

# Writing
new_post_name: :title.md
default_layout: post
titlecase: false
external_link:
  enable: true
  field: site
  exclude: ''
filename_case: 1
render_drafts: false
post_asset_folder: true
relative_link: false
future: true
syntax_highlighter: highlight.js
highlight:
  line_number: true
  auto_detect: false
  tab_replace: ''
  wrap: true
  hljs: false

# Home page
index_generator:
  path: ''
  per_page: 10
  order_by: -date

# Pagination
per_page: 10
pagination_dir: page

# Theme
theme: next

# Local search
search:
  path: search.xml
  field: post
  content: true
  format: html

# Feed
feed:
  type: atom
  path: atom.xml
  limit: 20
  content: true
  order_by: -date

# Deployment
deploy:
  type: git
  repo: git@github.com:zycrwa/markdown.git
  branch: gh-pages
  message: Site updated by Hexo
